[project]
name = "hubapp"
version = "0.1.0"
description = "Personal inventory + manual assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
]
# ragapp (rtfm-rag) is a local sibling repo, installed separately as an editable
# package rather than listed here as a file:// path dependency — see README.md.
# Keeping it out of pyproject.toml avoids baking a machine-specific relative path
# into packaging metadata.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
